name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      # Gemfile.lock only lists arm64-darwin; add the runner's platform until
      # the lockfile is regenerated (bundle lock --add-platform x86_64-linux),
      # after which this can go back to `bundler-cache: true`.
      - name: Install gems
        run: |
          bundle lock --add-platform x86_64-linux
          bundle install --jobs 4

      - name: Lint code for consistent style
        run: |
          # Surface RuboCop's own errors (config, plugins) as annotations too.
          bin/rubocop -f github 2> rubocop-errors.txt || status=$?
          grep -v '^\s*$' rubocop-errors.txt | head -20 | sed 's/^/::error title=rubocop::/' || true
          exit ${status:-0}

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [ "4.0" ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Install gems
        run: |
          bundle lock --add-platform x86_64-linux
          bundle install --jobs 4

      - name: Run tests
        run: bin/test
